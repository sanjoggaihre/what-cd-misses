optimizer:
  type: AdamW
  kwargs:
    lr: 0.0001
    weight_decay: 0.05

scheduler:
  type: CosLR
  kwargs:
    epochs: 300
    initial_epochs: 5

dataset:
  train:
    _base_: cfgs/dataset_configs/Pepper.yaml
    others: {subset: train, npoints: 16384, bs: 4}
  val:
    _base_: cfgs/dataset_configs/Pepper.yaml
    others: {subset: val, npoints: 16384, bs: 8}
  test:
    _base_: cfgs/dataset_configs/Pepper.yaml
    others: {subset: test, npoints: 16384, bs: 4}

model:
  NAME: Point_MAE          # the only substantive change
  group_size: 64           # must match the hybrid
  num_group: 512
  loss: cdl1
  use_density_loss: True
  w_spacing: 0.0
  w_repulsion: 14
  repulsion_h: 0.014
  w_hole: 0.0
  transformer_config:
    mask_ratio: 0.6
    mask_type: rand
    trans_dim: 384
    encoder_dims: 384
    depth: 12
    drop_path_rate: 0.1
    num_heads: 6
    decoder_depth: 4
    decoder_num_heads: 6

npoints: 16384
total_bs: 4
step_per_update: 8
max_epoch: 300